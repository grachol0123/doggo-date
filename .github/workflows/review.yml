# AI code review on every pull request to main/master.
# - comment with the summary, label ai-cr:passed / ai-cr:failed, failing check on "fail"
# - re-run on demand by adding the ai-cr:review label
# Requires the COPILOT_GITHUB_TOKEN repository secret: a fine-grained PAT with the
# "Copilot Requests" permission (usage is billed to that user's Copilot plan).
# Fork PRs get no secrets, so the review is skipped for them.
# Branch protection is not available on this repo's plan, so "fail" only turns the check red.
name: AI Code Review

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write # labels live on the issues API

jobs:
  review:
    # Fork PRs get no secrets, so they are skipped instead of failing
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
    # Job-level, so an unrelated label event (job skipped) cannot cancel a running review
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, otherwise there is no base to diff against

      - name: Compute diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        # Fixtures hold deliberately flawed code for evals; lockfiles and context/ are noise for review.
        run: |
          git diff "origin/$BASE_REF...HEAD" -- . \
            ':(exclude)reviewer/fixtures' ':(exclude)*package-lock.json' ':(exclude)context' \
            > "$RUNNER_TEMP/pr.diff"
          # Nothing reviewable (e.g. docs-only change): skip the review instead of failing
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      - id: review
        if: steps.diff.outputs.empty != 'true'
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          pr-title: ${{ github.event.pull_request.title }}
          pr-body: ${{ github.event.pull_request.body }}
          diff-file: ${{ runner.temp }}/pr.diff

      - name: Comment and label
        if: always() && steps.review.outputs.verdict != ''
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_FILE: ${{ steps.review.outputs.review-file }}
        run: |
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(`## AI Code Review: ${r.verdict}\n\n${r.summary}`)' "$REVIEW_FILE" > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          gh label create ai-cr:passed --color 0E8A16 --force
          gh label create ai-cr:failed --color B60205 --force
          if [ "$VERDICT" = pass ]; then add=ai-cr:passed; drop=ai-cr:failed; else add=ai-cr:failed; drop=ai-cr:passed; fi
          gh pr edit "$PR" --add-label "$add" --remove-label "$drop"
          gh pr edit "$PR" --remove-label ai-cr:review || true

      - name: Gate on verdict
        if: steps.diff.outputs.empty != 'true'
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          test "$VERDICT" = pass || { echo "AI review verdict: ${VERDICT:-missing}"; exit 1; }
