name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy
# validation, and allow manual testing through the repository's "Actions" tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install JavaScript dependencies
        run: npm ci

      # Generates .astro/types.d.ts (gitignored). Without it, `npx tsc --noEmit`
      # fails on astro:content/astro:env module imports. The end-of-turn hook
      # (.github/hooks/end-of-turn.mjs) also regenerates this itself, but doing
      # it once here means the agent's dev environment starts from a working
      # baseline rather than only fixing it the first time a hook runs.
      - name: Generate Astro types
        run: npx astro sync
